version: 1
name: quickstart_ohlcv

input:
  expected_headers:
    - Date
    - Open
    - High
    - Low
    - Close
    - Volume

output:
  columns:
    - name: date
      source: Date
      transform: trim
    - name: open
      source: Open
      transform: parse_flexible_number
    - name: high
      source: High
      transform: parse_flexible_number
    - name: low
      source: Low
      transform: parse_flexible_number
    - name: close
      source: Close
      transform: parse_flexible_number
    - name: volume
      source: Volume
      transform: parse_flexible_number

layout:
  time_col: date
  time_kind: YyyyMmDd
  value_cols:
    - open
    - high
    - low
    - close
    - volume
  primary_value_col: close

row_rules:
  - name: required
    column: date
    action: reject
  - name: nonnegative
    column: volume
    action: reject

reject_policy: fail
